# .github/workflows/synthetic-replays.yml
name: Synthetic Session Replays

on:
  schedule:
    - cron: '0 */3 * * *'     # every 3 hours
  workflow_dispatch:

jobs:
  generate-traffic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install
      - run: npx playwright install chromium --with-deps

      - name: Run AI Replay Script
        run: npx tsx scripts/generate-replays.ts
        env:
          APP_URL: 'https://hogflix-project.vercel.app/'
          # This pulls the key from the secret you created in Step 1
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # Browser-driven FlixBuddy funnel personas. Unlike the server-side
      # flixbuddy-experiment-funnel.js (posthog-node, so a replay is impossible),
      # each persona here signs up in a real browser: it becomes its own Person
      # AND owns a session recording. That is what makes funnel -> replay work.
      # Filter any insight on `replay_demo = true` to get only these people.
      - name: Run FlixBuddy replay funnel
        run: npx tsx scripts/synthetic/flixbuddy-replay-funnel.ts
        env:
          APP_URL: 'https://hogflix-project.vercel.app'
          PERSONA_COUNT: '8'
          ABANDON_RATE: '0.45'
